name: Pylint

on: [push]

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.8", "3.9", "3.10"]
    steps:
    - uses: actions/checkout@v4
    - name: Set up Python ${{ matrix.python-version }}
      uses: actions/setup-python@v3
      with:
        python-version: ${{ matrix.python-version }}
    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install pylint
        # Install project dependencies if a requirements file exists; otherwise install common heavy deps used by the repo.
        if [ -f requirements.txt ]; then
          pip install -r requirements.txt
        else
          pip install numpy pandas matplotlib scipy scikit-learn openpyxl
        fi
        # Install the package in editable mode if the repo is an installable package, otherwise add workspace to PYTHONPATH for pylint.
        if [ -f setup.py ] || [ -f pyproject.toml ]; then
          pip install -e .
        else
          echo "No installable package found; adding repo root to PYTHONPATH for pylint"
          echo "PYTHONPATH=${GITHUB_WORKSPACE}:$PYTHONPATH" >> $GITHUB_ENV
        fi
    - name: Analysing the code with pylint
      run: |
        # Prefer running pylint on the package directory to avoid linting external files;
        # fall back to all tracked .py files if the package directory is missing.
        if [ -d mathematical_model_learning ]; then
          pylint mathematical_model_learning
        else
          pylint $(git ls-files '*.py')
        fi
